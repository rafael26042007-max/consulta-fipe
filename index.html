<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta FIPE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>🚗 Consulta Tabela FIPE</h1>
        <p class="subtitulo">Dados fornecidos pela <a href="https://brasilapi.com.br/" target="_blank" rel="noopener noreferrer">BrasilAPI</a></p>

        <section class="card">
            <h2>Consultar preço</h2>

            <form id="formFipe" novalidate>
                <label for="codigoFipe">Código FIPE</label>
                <input type="text" id="codigoFipe" placeholder="Ex.: 001004-9" inputmode="numeric" maxlength="8" required>

                <label for="tabelaReferencia">Mês de referência</label>
                <select id="tabelaReferencia">
                    <option value="">Mais recente</option>
                </select>

                <button type="submit" id="btnConsultar">Consultar</button>
            </form>
        </section>

        <div id="loading" class="loading oculto" role="status" aria-live="polite">
            <div class="spinner"></div>
            <span>Consultando a tabela FIPE...</span>
        </div>

        <div id="status" class="status" role="alert" aria-live="assertive"></div>

        <section id="resultado" aria-live="polite"></section>

        <section class="card">
            <h2>Explore marcas e modelos</h2>
            <p class="dica">Veja os modelos disponíveis de cada marca na tabela FIPE.</p>

            <label for="tipoVeiculo">Tipo de veículo</label>
            <select id="tipoVeiculo">
                <option value="carros">Carros</option>
                <option value="motos">Motos</option>
                <option value="caminhoes">Caminhões</option>
            </select>

            <label for="marca">Marca</label>
            <select id="marca" disabled>
                <option value="">Carregando marcas...</option>
            </select>

            <div id="loadingModelos" class="loading loading-modelos oculto" role="status" aria-live="polite">
                <div class="spinner"></div>
                <span>Buscando modelos...</span>
            </div>

            <div id="statusModelos" class="status" role="alert" aria-live="assertive"></div>

            <ul id="listaModelos" class="lista-modelos"></ul>
        </section>
    </main>

    <script src="fipeApi.js"></script>
</body>

</html>
