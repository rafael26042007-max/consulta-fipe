<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta FIPE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>🚗 Consulta Tabela FIPE</h1>
        <p class="subtitulo">Dados fornecidos pela <a href="https://fipe.api.br/" target="_blank" rel="noopener noreferrer">API FIPE (Parallelum)</a></p>

        <section class="card">
            <label for="referencia">Mês de referência</label>
            <select id="referencia">
                <option value="">Mais recente</option>
            </select>
        </section>

        <section class="card">
            <h2>Buscar pelo carro</h2>

            <label for="tipoVeiculo">Tipo de veículo</label>
            <select id="tipoVeiculo">
                <option value="cars">Carros</option>
                <option value="motorcycles">Motos</option>
                <option value="trucks">Caminhões</option>
            </select>

            <label for="marca">Marca</label>
            <select id="marca" disabled>
                <option value="">Carregando marcas...</option>
            </select>

            <label for="filtroModelo">Modelo</label>
            <input type="search" id="filtroModelo" placeholder="Digite para filtrar (ex.: Gol, Onix 1.0)" autocomplete="off" disabled>
            <select id="modelo" disabled>
                <option value="">Escolha uma marca primeiro</option>
            </select>

            <label for="ano">Ano</label>
            <select id="ano" disabled>
                <option value="">Escolha um modelo primeiro</option>
            </select>

            <div id="loadingCarro" class="loading oculto" role="status" aria-live="polite">
                <div class="spinner"></div>
                <span id="loadingCarroTexto">Carregando...</span>
            </div>

            <div id="statusCarro" class="status" role="alert" aria-live="assertive"></div>

            <div id="resultadoCarro" aria-live="polite"></div>
        </section>

        <section class="card">
            <h2>Buscar pelo código FIPE</h2>

            <form id="formCodigo" novalidate>
                <label for="codigoFipe">Código FIPE</label>
                <input type="text" id="codigoFipe" placeholder="Ex.: 004278-1" inputmode="numeric" maxlength="8" autocomplete="off" required>

                <button type="submit" id="btnConsultar">Consultar</button>
            </form>

            <div id="loadingCodigo" class="loading oculto" role="status" aria-live="polite">
                <div class="spinner"></div>
                <span>Consultando a tabela FIPE...</span>
            </div>

            <div id="statusCodigo" class="status" role="alert" aria-live="assertive"></div>

            <div id="resultadoCodigo" aria-live="polite"></div>
        </section>
    </main>

    <script src="fipeApi.js"></script>
</body>

</html>
