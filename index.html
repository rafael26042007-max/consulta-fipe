<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta FIPE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>🚗 Consulta Tabela FIPE</h1>
        <p class="subtitulo">Dados fornecidos pela <a href="https://brasilapi.com.br/" target="_blank">BrasilAPI</a></p>

        <!-- ===== 1. CONSULTA PELO CÓDIGO FIPE ===== -->
        <section class="card">
            <h2>Consultar preço</h2>

            <form id="formFipe">
                <label for="codigoFipe">Código FIPE</label>
                <input type="text" id="codigoFipe" placeholder="Ex.: 001004-9" required>

                <label for="tabelaReferencia">Mês de referência</label>
                <select id="tabelaReferencia">
                    <option value="">Mais recente</option>
                </select>

                <button type="submit" id="btnConsultar">Consultar</button>
            </form>
        </section>

        <!-- ===== 2. INDICADOR DE PROCESSAMENTO ===== -->
        <!-- Fica escondido (classe "oculto") e aparece enquanto a requisição está em andamento -->
        <div id="loading" class="loading oculto">
            <div class="spinner"></div>
            <span id="loadingTexto">Consultando a tabela FIPE...</span>
        </div>

        <!-- Mensagens de erro -->
        <div id="status" class="status"></div>

        <!-- ===== 3. RESULTADO ===== -->
        <section id="resultado"></section>

        <!-- ===== 4. EXPLORAR MARCAS E MODELOS (extra) ===== -->
        <section class="card">
            <h2>Não sabe o código? Explore marcas e modelos</h2>

            <label for="tipoVeiculo">Tipo de veículo</label>
            <select id="tipoVeiculo">
                <option value="carros">Carros</option>
                <option value="motos">Motos</option>
                <option value="caminhoes">Caminhões</option>
            </select>

            <label for="marca">Marca</label>
            <select id="marca">
                <option value="">Carregando marcas...</option>
            </select>

            <ul id="listaModelos" class="lista-modelos"></ul>
        </section>
    </main>

    <script src="fipeApi.js"></script>
</body>

</html>
